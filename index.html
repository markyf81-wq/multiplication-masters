<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fff3cc">
    <meta name="description" content="Practise times tables with timed flashcards, retries, quizzes and progress reports.">
    <title>Multiplication Masters</title>
    <link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./src/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="#play" aria-label="Multiplication Masters home">
        <img class="brand-logo" src="./assets/logo.svg" width="72" height="72" alt="">
        <span class="brand-wordmark">Multiplication<span class="brand-second">Masters<span class="brand-dot">!</span></span></span>
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="#play" data-route="play" data-student-nav>Play</a>
        <a href="#progress" data-route="progress" data-student-nav>My progress</a>
        <a href="#medals" data-route="medals" data-student-nav>My medals</a>
        <a href="#teacher" data-route="teacher" id="teacher-nav" hidden>Students</a>
        <a href="#results" data-route="results" id="results-nav" hidden>Results</a>
      </nav>
      <button class="profile-button" id="profile-button" type="button" aria-haspopup="dialog"><span class="avatar" aria-hidden="true">✦</span><span id="profile-label">Sign in</span><span class="profile-chevron icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span></button>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="site-footer"><span>Multiplication Masters</span><a href="#guide" data-link="guide">Teacher guide</a></footer>
    <dialog id="account-dialog" aria-labelledby="account-title">
      <button type="button" class="dialog-close icon-button" data-close-dialog aria-label="Close account menu">×</button>
      
      <h2 id="account-title">Account</h2>
      <p class="muted" id="account-description">Google account sign-in</p>
      <div id="account-content"></div>
      <p id="account-status" class="notice account-status" role="alert" tabindex="-1" hidden></p>
    </dialog>
    <dialog id="confirm-dialog" aria-labelledby="confirm-title">
      <h2 id="confirm-title">Leave this game?</h2>
      <p class="muted">This unfinished game won’t be saved.</p>
      <div class="dialog-actions"><button class="button secondary" id="stay-button" type="button">Continue game</button><button class="button" id="leave-button" type="button">Leave game</button></div>
    </dialog>
    <dialog id="student-import-dialog" class="student-import-dialog" aria-labelledby="student-import-title">
      <button type="button" class="dialog-close icon-button" data-close-dialog aria-label="Close student import">×</button>
      <h2 id="student-import-title" tabindex="-1">Import students</h2>
      <div id="student-import-content"></div>
    </dialog>
    <dialog id="teacher-access-dialog" aria-labelledby="teacher-access-title" aria-describedby="teacher-access-description">
      <span class="eyebrow">TEACHER ACCESS</span>
      <h2 id="teacher-access-title">Add a teacher?</h2>
      <p id="teacher-access-description" class="muted"></p>
      <p id="teacher-access-status" class="small" role="status"></p>
      <div class="dialog-actions"><button class="button secondary" type="button" data-action="cancel-teacher-access">Cancel</button><button class="button" type="button" data-action="confirm-teacher-access">Grant teacher access</button></div>
    </dialog>
    <dialog id="student-manage-dialog" aria-labelledby="student-manage-title" aria-describedby="student-manage-description">
      <h2 id="student-manage-title">Manage student</h2>
      <p id="student-manage-description"></p>
      <p id="student-manage-status" class="small" role="status"></p>
      <div class="dialog-actions"><button class="button secondary" type="button" data-action="cancel-student-management">Cancel</button><button class="button" type="button" data-action="confirm-student-management">Confirm</button></div>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <noscript><p class="notice">Turn on JavaScript to play Multiplication Masters.</p></noscript>
  </body>
</html>
